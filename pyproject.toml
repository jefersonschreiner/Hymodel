[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hymodel"
version = "0.1.0"
description = "Water Resources Code Library"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Jeferson Schreiner Jr.", email = "jeferson.schreiner@hotmail.com"},
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.urls]
Homepage = "https://github.com/jefersonschreiner/Hymodel"
Repository = "https://github.com/jefersonschreiner/Hymodel"
Issues = "https://github.com/jefersonschreiner/Hymodel/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "flake8", "mypy"]
docs = ["sphinx", "sphinx-rtd-theme"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hymodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]